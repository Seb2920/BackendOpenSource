spring.application.name=OpenSourceBackend


# Regla 1: Base de datos brewdog_db con creación automática

spring.datasource.url=dbc:mysql://localhost:3306/brewdog_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Regla 3: Creación automática de tablas ORM y Estrategia SnakeCase Pluralizada

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.fivebits.opensourcebackend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Regla 5 (RN05): Archivos de Internacionalización (i18n)

spring.messages.basename=i18nn/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Regla 6: Documentación OpenAPI / Swagger UI

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


